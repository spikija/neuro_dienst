name: neuro_admin
description: "NeuroDienst desktop administrator client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  pdf: ^3.13.1
  printing: ^5.15.1
  file_selector: ^1.1.0
  neuro_core:
    path: ../neuro_core
  neuro_admin_services:
    path: ../neuro_admin_services
  supabase_flutter: ^2.14.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
